name: Update ETF Data

on:
  schedule:
    # 매일 한국시간 오전 8시 (UTC 23시, 일~목) - 미국장 마감 후
    - cron: '0 23 * * 0-4'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install yfinance pandas python-dateutil requests
      
      - name: Run data collection
        run: |
          cd scripts
          python collect_etf_data.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/public/data/etf_database.json
          git diff --staged --quiet || git commit -m "Update ETF data $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Deploy to Vercel
        run: |
          npm install -g vercel
          DEPLOY_URL=$(vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes 2>&1 | grep "Production:" | awk '{print $2}')
          vercel alias $DEPLOY_URL etf-hub.vercel.app --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_n6131nX1byKbcojrjBtoIuKh
          VERCEL_PROJECT_ID: prj_Jv8uSttA6EGClbSAVd0mgPHklVqx

name: Update ETF Data

on:
  schedule:
    # 매일 한국시간 오전 8시 (UTC 23시, 일~목) - 미국장 마감 후
    - cron: '0 23 * * 0-4'
    # 주간 리포트: 매주 월요일 한국시간 오전 8시 (UTC 일요일 23시)
    - cron: '0 23 * * 0'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install yfinance pandas python-dateutil requests
      
      - name: Run data collection
        run: |
          cd scripts
          python collect_etf_data.py

      - name: Run history data collection
        continue-on-error: true  # 실패해도 이메일/배포는 계속 진행
        run: |
          cd scripts
          python collect_history_data.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/public/data/etf_database.json frontend/public/data/etf_history.json
          git diff --staged --quiet || git commit -m "Update ETF data $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Send daily category report (매일 실행)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          cd scripts
          python send_daily_report.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}

      - name: Send weekly email report (월요일만 실행)
        if: github.event_name == 'schedule' && github.event.schedule == '0 23 * * 0'
        run: |
          cd scripts
          python send_weekly_report.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}

      - name: Deploy to Vercel
        run: |
          npm install -g vercel
          cd frontend
          DEPLOY_URL=$(vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes 2>&1 | grep -o 'https://frontend-[^ ]*\.vercel\.app' | head -1)
          echo "Deploying to: $DEPLOY_URL"
          vercel alias $DEPLOY_URL etf-hub.vercel.app --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_n6131nX1byKbcojrjBtoIuKh
          VERCEL_PROJECT_ID: prj_Jv8uSttA6EGClbSAVd0mgPHklVqx
